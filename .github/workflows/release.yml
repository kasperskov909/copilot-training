name: Release After Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Merged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Tag and Publish Generated Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const createRelease = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/create-release.cjs`);
            await createRelease({ github, context, core });